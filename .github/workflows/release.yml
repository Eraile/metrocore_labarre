# Construit un APK signe et l'attache a une Release GitHub.
#
# Declenche par un tag `v*` :
#     git tag v1.0.0 && git push origin v1.0.0
#
# Quatre secrets sont requis (Settings -> Secrets and variables -> Actions).
# Voir RELEASING.md pour les obtenir.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Necessaire pour que `gh release` puisse ecrire.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # On echoue ici, explicitement, plutot que de laisser Gradle produire un
      # `app-release-unsigned.apk` et de le publier sans que personne ne le remarque.
      - name: Verifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Secrets manquants :$missing — voir RELEASING.md" >&2
            exit 1
          fi

      - name: Retablir la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          # Ecrit avec printf et non un here-doc interpole : un mot de passe
          # contenant $ ou ` serait sinon mange par le shell.
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
          } > keystore.properties

      - name: Construire
        run: ./gradlew --no-daemon assembleRelease

      - name: Nommer l'APK
        id: apk
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "APK signe introuvable — la signature n'a pas ete prise en compte." >&2
            ls -l app/build/outputs/apk/release/ >&2
            exit 1
          fi
          name="la-barre-${GITHUB_REF_NAME}.apk"
          mv "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "La Barre $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # Le runner est jetable, mais on ne laisse pas trainer une cle en clair
      # meme quelques secondes de plus que necessaire.
      - name: Effacer la cle
        if: always()
        run: rm -f release.jks keystore.properties
